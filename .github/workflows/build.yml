name: Build APK and WorldModel.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |error: |AAPT: error' build.log | head -25 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error title=Compile error::${line}"
          done
          block=$(awk '/What went wrong:/{f=1} f{print} /Try:/{exit}' build.log | head -40)
          block="${block//'%'/'%25'}"
          block="${block//$'\n'/'%0A'}"
          echo "::error title=What went wrong::${block}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk sensor-capture.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: sensor-capture.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get uv (installs Python and PyTorch on the user's PC)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvdir
          Copy-Item (Get-ChildItem uvdir -Recurse -Filter uv.exe | Select-Object -First 1).FullName .
          .\uv.exe --version

      - name: Check the pipeline scripts compile
        run: python -m py_compile launcher/launcher.py pipeline/preprocess.py pipeline/encode_latents.py pipeline/worldmodel.py pipeline/train.py pipeline/dream.py pipeline/play.py pipeline/bench.py tools/check_session.py

      - name: Build WorldModel.exe
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --console --name WorldModel `
            --add-data "pipeline;pipeline" --add-data "tools;tools" --add-binary "uv.exe;." `
            launcher/launcher.py
          Get-Item dist/WorldModel.exe

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/WorldModel.exe

  release:
    needs: [apk, exe]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: List files
        run: ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            - `sensor-capture.apk`: install on the phone. Same signing key every build, so it updates in place.
            - `WorldModel.exe`: put it in its own folder on the PC (e.g. D:\WorldModel) and drop your SensorCapture folder on it.
            Commit: ${{ github.sha }}
          files: out/*
          make_latest: true
