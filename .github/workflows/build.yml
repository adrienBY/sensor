name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Kotlin / resource errors as individual annotations
          grep -E '^e: |error: |AAPT: error' build.log | head -25 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error title=Compile error::${line}"
          done
          # Gradle's own explanation, as one annotation
          block=$(awk '/What went wrong:/{f=1} f{print} /Try:/{exit}' build.log | head -40)
          block="${block//'%'/'%25'}"
          block="${block//$'\n'/'%0A'}"
          echo "::error title=What went wrong::${block}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk sensor-capture.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sensor Capture build ${{ github.run_number }}
          body: |
            Install `sensor-capture.apk` on the phone. Every build is signed with the same key,
            so it installs over the previous one and keeps your coverage counters.
            Commit: ${{ github.sha }}
          files: sensor-capture.apk
          make_latest: true
